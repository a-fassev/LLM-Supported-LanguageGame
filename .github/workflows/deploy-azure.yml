name: Deploy Next.js app to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build -- --webpack

      - name: Materialize Next external package links                                                                                                  
          shell: bash                                                                                                                                    
          run: |                                                                                                                                         
            if [ -d .next/node_modules ]; then                                                                                                           
              find .next/node_modules -maxdepth 1 -type l -print0 | while IFS= read -r -d '' link; do                                                    
                target="$(readlink -f "$link")"                                                                                                          
                rm "$link"                                                                                                                               
                cp -R "$target" "$link"                                                                                                                  
              done                                                                                                                                       
            fi        

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: enigma-di-bologna
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
