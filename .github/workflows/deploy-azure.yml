name: Deploy Next.js app to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build -- --webpack

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy/.next
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          node <<'NODE'
          const fs = require("node:fs");
          const packagePath = "deploy/package.json";
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          pkg.scripts = { start: "node server.js" };
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Deploy to Azure Web App
        # App Service application settings (not in repo): OPENAI_API_KEY required for freetext LLM.
        # Remove legacy GEMINI_* settings when deploying the OpenAI migration.
        # clean: true removes orphaned content JSON from prior deploys (catalog reads all scene files on disk).
        uses: azure/webapps-deploy@v3
        with:
          app-name: enigma-di-bologna
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy
          clean: true
