      <stop offset="1" stop-color="#d9bd8e"/>
    </linearGradient>
    <linearGradient id="tapeFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8cf99" stop-opacity="0.74"/>
      <stop offset="0.5" stop-color="#f5dfad" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#d8b978" stop-opacity="0.72"/>
