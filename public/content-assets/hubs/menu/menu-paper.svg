      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.58" stop-color="#f7e8cd"/>
      <stop offset="1" stop-color="#ead7b4"/>
    </linearGradient>
    <linearGradient id="curlFill" x1="0" y1="0" x2="1" y2="1">
